name: Check bootstrap build definitions
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  definitions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # ratchet:actions/checkout@v5
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # ratchet:cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false
      - name: Evaluate both builder systems
        run: nix flake check --no-build --all-systems --no-update-lock-file
      - name: Check hashed packages and argument ownership with pinned Zig
        run: |
          zig_check_dir="$RUNNER_TEMP/package-check-zig"
          mkdir -p "$zig_check_dir"
          curl --fail --location --retry 3 https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz -o "$zig_check_dir/zig.tar.xz"
          printf '%s  %s\n' 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026 "$zig_check_dir/zig.tar.xz" | sha256sum --check
          tar -xJf "$zig_check_dir/zig.tar.xz" --strip-components=1 -C "$zig_check_dir"
          python3 ci/test-package-consumption.py --zig "$zig_check_dir/zig" --archive-script nix/archive.py
          "$zig_check_dir/zig" test zig/lib/compiler/dynamic_linker_ownership_test.zig \
            --zig-lib-dir "$PWD/zig/lib" -OReleaseSafe \
            --test-filter 'module arguments retain dynamic linker paths after target queries return'
      - name: Verify archive normalization and cache boundaries
        run: |
          nix build --no-update-lock-file .#checks.x86_64-linux.archives
          python3 nix/check-cache-inputs.py
          python3 ci/test-release-validation.py
          python3 ci/test-monitor-build.py
          for script in build nix/stages/*.sh; do sh -n "$script"; done
          bash -n ci/verify-provenance.sh
